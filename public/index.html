<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Своя игра | Онлайн</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <header>
                <h1><i class="fas fa-gamepad"></i> Своячок</h1>
                <p class="subtitle">Эщкере</p>
            </header>
            
            <div id="connection-screen" class="screen active">
                <div class="card">
                    <h2><i class="fas fa-user"></i> Ваш профиль</h2>
                    <div class="form-group">
                        <input type="text" id="username" placeholder="Ваше имя" value="Игрок">
                    </div>
                    
                    <h3><i class="fas fa-users"></i> Начать игру</h3>
                    <div class="button-group">
                        <button id="create-room-btn" class="btn btn-primary">
                            <i class="fas fa-plus-circle"></i> Создать комнату
                        </button>
                        
                        <div class="divider">или</div>
                        
                        <div class="join-section">
                            <input type="text" id="room-code" placeholder="Код комнаты" maxlength="6">
                            <button id="join-room-btn" class="btn btn-success">
                                <i class="fas fa-sign-in-alt"></i> Присоединиться
                            </button>
                        </div>
                    </div>
                    
                    <div id="room-info" class="room-info hidden">
                        <h3><i class="fas fa-check-circle"></i> Комната создана!</h3>
                        <div class="room-code">
                            Код: <span id="room-code-display">ABCD12</span>
                            <button id="copy-code-btn" class="btn btn-secondary">
                                <i class="fas fa-copy"></i> Копировать
                            </button>
                        </div>
                        <button id="enter-room-btn" class="btn btn-primary">
                            <i class="fas fa-play"></i> Войти в комнату
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="game-screen" class="screen">
                <div class="game-header">
                    <div id="host-panel" class="panel hidden">
                        <h2><i class="fas fa-crown"></i> Вы - Ведущий</h2>
                        <div class="room-code">Комната: <span id="current-room-code">ABCD12</span></div>
                    </div>
                    
                    <div id="player-panel" class="panel hidden">
                        <h2><i class="fas fa-user"></i> Вы - Игрок</h2>
                        <div class="score">Баллы: <span id="player-score">0</span></div>
                    </div>
                </div>
                
                <div class="game-container">
                    <!-- Игровая логика будет добавляться через JavaScript -->
                    <div id="players-container"></div>
                    <div id="question-container"></div>
                    <div id="chat-container"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
